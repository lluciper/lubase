name: lubase
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Route
  auto_route: ^10.0.1

  # State management
  flutter_bloc: ^9.1.1

  # HTTP
  dio: ^5.8.0+1
  retrofit: ^4.4.2
  http: ^1.4.0
  pretty_dio_logger: ^1.4.0

  # Image
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.0

  # Date time
  intl: ^0.20.2

  # Dependency injection
  get_it: ^8.0.3
  injectable: ^2.5.0
  equatable: ^2.0.7

  # Dart data class
  json_annotation: ^4.9.0
  freezed: ^3.0.6

  # Localizations
  flutter_localizations:
    sdk: flutter

  # Local storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4


  # Linting

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Gen
  build_runner: ^2.5.3

  # Code generators
  auto_route_generator: ^10.2.3
  retrofit_generator: ^9.2.0
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.5
  freezed_annotation: ^3.0.0

  # Gen assets
  flutter_gen_runner: ^5.10.0

  flutter_lints: ^6.0.0

flutter_gen:
  output: lib/resources/generated/
  integrations:
    flutter_svg: true
    rive: true
    lottie: true

  assets:
    outputs:
      style: camel-case

flutter_intl:
  enabled: true # Required. Must be set to true to activate the package. Default: false
  class_name: S # Optional. Sets the name for the generated localization class. Default: S
  main_locale: vi # Optional. Sets the main locale used for generating localization files. Provided value should consist of language code and optional script and country codes separated with underscore (e.g. 'en', 'en_GB', 'zh_Hans', 'zh_Hans_CN'). Default: en
  arb_dir: lib/resources/l10n
  output_dir: lib/resources/generated/

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/
    # - .env

  fonts:
    - family: SF-Pro-Text
      fonts:
        - asset: assets/fonts/SF-Pro-Text-Black.otf
        - asset: assets/fonts/SF-Pro-Text-Bold.otf
        - asset: assets/fonts/SF-Pro-Text-Heavy.otf
        - asset: assets/fonts/SF-Pro-Text-Light.otf
        - asset: assets/fonts/SF-Pro-Text-Medium.otf
        - asset: assets/fonts/SF-Pro-Text-Regular.otf
        - asset: assets/fonts/SF-Pro-Text-Semibold.otf
        - asset: assets/fonts/SF-Pro-Text-Thin.otf