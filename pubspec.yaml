name: lubase
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0

  # UI
  cupertino_icons: ^2.0.0
  flutter_svg: ^2.2.2
  visibility_detector: ^0.4.0+2
  
  # REST API
  # http: ^1.4.0
  dio: ^5.11.1
  retrofit: ^4.9.1

  # Store
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.2.0

  # Utils 
  connectivity_plus: ^7.0.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  json_annotation: ^4.9.0
  logger: ^2.6.2
  flutter_localizations:
    sdk: flutter
  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.10.4
  freezed: ^4.0.3
  retrofit_generator: ^10.2.0
  json_serializable: ^6.11.1
  flutter_gen_runner: ^5.12.0
  go_router_builder: ^4.1.1
  intl_utils: ^2.8.17
flutter_gen:
  output: lib/resources/generated/
  integrations:
    flutter_svg: true
    rive: true
    lottie: true

  assets:
    outputs:
      style: camel-case

flutter:
  uses-material-design: true
  generate: true

flutter_intl:
  enabled: true
  arb_dir: lib/resources/l10n
  output_dir: lib/resources/generated/

  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/
    # - .env

  fonts:
    - family: SF-Pro-Text
      fonts:
        - asset: assets/fonts/SF-Pro-Text-Black.otf
        - asset: assets/fonts/SF-Pro-Text-Bold.otf
        - asset: assets/fonts/SF-Pro-Text-Heavy.otf
        - asset: assets/fonts/SF-Pro-Text-Light.otf
        - asset: assets/fonts/SF-Pro-Text-Medium.otf
        - asset: assets/fonts/SF-Pro-Text-Regular.otf
        - asset: assets/fonts/SF-Pro-Text-Semibold.otf
        - asset: assets/fonts/SF-Pro-Text-Thin.otf