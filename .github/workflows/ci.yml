name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - run: flutter pub get

      - name: Regenerate code and format
        run: |
          dart run build_runner build
          dart run intl_utils:generate
          dart format lib test

      # Fails when generated files, ARB output or formatting were not committed.
      - name: Working tree is clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - run: dart analyze --fatal-infos

      - run: flutter test
